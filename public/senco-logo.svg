<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Royal Maroon Gradient -->
    <linearGradient id="sencoMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881326" />
      <stop offset="50%" stop-color="#720d1e" />
      <stop offset="100%" stop-color="#4e0612" />
    </linearGradient>
    
    <!-- Lustrous Gold Gradient -->
    <linearGradient id="sencoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae08c" />
      <stop offset="35%" stop-color="#e5b84c" />
      <stop offset="70%" stop-color="#c9962a" />
      <stop offset="100%" stop-color="#8c6413" />
    </linearGradient>

    <!-- Subtle Outer Glow / Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Luxury Tile -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#sencoMaroon)" stroke="url(#sencoGold)" stroke-width="2.5" />

  <!-- Inner Delicate Filigree Border -->
  <rect x="12" y="12" width="96" height="96" rx="20" fill="none" stroke="url(#sencoGold)" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.6" />

  <!-- Faceted Diamond & Crown Motif -->
  <g filter="url(#goldGlow)">
    <!-- Central Brilliant Cut Diamond Top Table -->
    <polygon points="60,26 77,38 72,52 48,52 43,38" fill="url(#sencoGold)" opacity="0.95" />
    
    <!-- Diamond Top Facets -->
    <polygon points="60,26 43,38 34,38 46,26" fill="url(#sencoGold)" opacity="0.8" />
    <polygon points="60,26 77,38 86,38 74,26" fill="url(#sencoGold)" opacity="0.85" />
    <polygon points="46,26 60,26 74,26" fill="#fff5d6" opacity="0.9" />

    <!-- Diamond Pavilion (Lower Cone) -->
    <polygon points="48,52 60,78 60,52" fill="url(#sencoGold)" opacity="0.95" />
    <polygon points="72,52 60,78 60,52" fill="#fff1c2" opacity="0.85" />
    <polygon points="43,38 48,52 60,78 34,38" fill="url(#sencoGold)" opacity="0.75" />
    <polygon points="77,38 72,52 60,78 86,38" fill="url(#sencoGold)" opacity="0.7" />

    <!-- Stylized Heritage 'S' Floral Swirl / Karigari Flourish -->
    <path d="M42,83 C48,80 58,80 64,84 C72,89 74,95 68,99 C60,103 48,100 46,95 C45,92 48,90 51,91 C53,92 54,95 59,95 C62,95 64,93 63,90 C61,87 53,86 48,84 C41,81 40,76 43,73 C46,70 51,70 53,72 C51,74 47,75 46,78 C45,80 47,82 50,83 Z" fill="url(#sencoGold)" />

    <!-- Tiny Accent Jewels / Sparkles -->
    <circle cx="60" cy="21" r="2" fill="#ffffff" />
    <circle cx="28" cy="46" r="1.5" fill="#fae08c" />
    <circle cx="92" cy="46" r="1.5" fill="#fae08c" />
  </g>
</svg>
